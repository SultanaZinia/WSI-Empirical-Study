# Experiment-level settings shared by all runs. Server paths live in server.yaml.

preprocess:
  thumbnail_magnification: 1.25
  patch_size: 256
  target_mpp: 0.5            # 20x equivalent
  label_overlap_threshold: 0.10
  min_tissue_fraction: 0.0   # keep any grid cell with tissue in it (TRIDENT --min_tissue_proportion default)
  lesion_merge_um: 75        # annotated regions closer than this are one lesion (official CAMELYON16 evaluate.py)

strata_mm:                   # largest contiguous lesion diameter
  itc_max: 0.2
  micro_max: 2.0

backbones:
  primary: uni               # ViT-L/16, D=1024
  secondary: conch           # ViT-B/16, D=512

budgets: [32, 64, 128, 256]

methods:
  - random
  - oracle
  - abmil_topk
  - siimil
  - nrk_abmil
  - lts
  - agile_pruner
  - tc_ssa
  - slicechat_pmil

training:
  n_folds: 5
  weak_supervision_only: true
  # CLAM defaults (mahmoodlab/CLAM main.py, core_utils.EarlyStopping), with early stopping enabled
  optimizer: adam
  lr: 1.0e-4
  weight_decay: 1.0e-5
  max_epochs: 200
  patience: 20               # epochs without val-loss improvement
  stop_epoch: 50             # never stop before this epoch
  dropout: 0.25

esi:
  threshold: 1.5
  svm_auc_threshold: 0.90

stats:
  bootstrap_iters: 1000
  ci: 0.95
  multiple_comparison: holm

froc_fp_per_slide: [0.25, 0.5, 1, 2, 4, 8]
