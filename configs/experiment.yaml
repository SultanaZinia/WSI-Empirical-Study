# Experiment-level settings shared by all runs. Server paths live in server.yaml.

preprocess:
  thumbnail_magnification: 1.25
  patch_size: 256
  target_mpp: 0.5            # 20x equivalent
  label_overlap_threshold: 0.10
  min_tissue_fraction: 0.0   # keep any grid cell with tissue in it (TRIDENT --min_tissue_proportion default)
  lesion_merge_um: 75        # annotated regions closer than this are one lesion (official CAMELYON16 evaluate.py)

strata_mm:                   # largest contiguous lesion diameter
  itc_max: 0.2
  micro_max: 2.0

backbones:
  primary: uni               # ViT-L/16, D=1024
  secondary: conch           # ViT-B/16, D=512

budgets: [32, 64, 128, 256]

# LSR is reported at every hit threshold (patch overlap with the lesion; 0 = any overlap). No single primary
# threshold yet: to be fixed from UNI's measured detectability (docs/metrics.md).
lsr_overlap_thresholds: [0.0, 0.05, 0.10, 0.25, 0.50]

# Training slides left out of all training, validation, normal key banks and probes: official label known to be
# wrong (normal_144 contains tumour; Liu et al. 2017, confirmed by the organisers). User decision 2026-11-02.
exclude_from_training: [normal_144]

# Tumour slides whose annotations are not exhaustive (official CAMELYON16 README; same 20 as Liu et al. 2017).
# Kept for training (slide labels are right); excluded from the primary lesion-level analysis, included as a
# sensitivity analysis (user decision 2026-11-02). Flagged in every lesion-level output.
non_exhaustive_slides: [tumor_010, tumor_015, tumor_018, tumor_020, tumor_025, tumor_029, tumor_033, tumor_034,
                        tumor_044, tumor_046, tumor_051, tumor_054, tumor_055, tumor_056, tumor_067, tumor_079,
                        tumor_085, tumor_092, tumor_095, tumor_110]

methods:                     # verified against papers/code on 2026-10-31; see docs/deviations.md
  - random
  - oracle
  - abmil_topk               # Ilse et al. 2018 (gated attention)
  - siimil                   # Su et al. 2023, arXiv 2301.07700, github.com/JoeSu666/SiiMIL
  - nrk_abmil                # Sajjad et al. 2023, Cancers 15(13):3428, github.com/cialab/NRKMIL
  - lts                      # Chen et al. 2026, arXiv 2606.08641 (no public code)
  - slicechat                # Bozkurt et al. 2026, arXiv 2609.24894, github.com/ali-kerem/SLICEChat (progressive pruning)
  - tc_ssa                   # Chen, Young, Xu 2026, arXiv 2603.01143, github.com/OzzyChen97/TC-SSA (merging, K slots)
  - pmil                     # Yu et al. 2023, Med Image Anal 85:102748, github.com/zihou98/PMIL (top-K + prototypes)

training:
  n_folds: 5
  weak_supervision_only: true
  # CLAM defaults (mahmoodlab/CLAM main.py, core_utils.EarlyStopping), with early stopping enabled
  optimizer: adam
  lr: 1.0e-4
  weight_decay: 1.0e-5
  max_epochs: 200
  patience: 20               # epochs without val-loss improvement
  stop_epoch: 50             # never stop before this epoch
  dropout: 0.25

esi:
  threshold: 1.5
  svm_auc_threshold: 0.90

stats:
  bootstrap_iters: 1000
  ci: 0.95
  multiple_comparison: holm

froc_fp_per_slide: [0.25, 0.5, 1, 2, 4, 8]
